[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invgate-service-desk-mcp"
version = "0.1.1"
description = "MCP server for the InvGate Service Desk API — exposes InvGate SD operations as Model Context Protocol tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alan (tracegazer)" }]
keywords = ["mcp", "invgate", "service-desk", "itsm", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
invgate-service-desk-mcp = "invgate_service_desk_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tracegazer/invgate-service-desk-mcp"
Repository = "https://github.com/tracegazer/invgate-service-desk-mcp"
Issues = "https://github.com/tracegazer/invgate-service-desk-mcp/issues"
Changelog = "https://github.com/tracegazer/invgate-service-desk-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/invgate_service_desk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:`LoggingHandler` in `opentelemetry-sdk` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
